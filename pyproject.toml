[project]
name = "wemo2"
version = "0.1.0"
description = "Memos2"
readme = "README.md"
authors = [
    { name = "Jackylee", email = "jieli.work@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=11.2.1",
    "psutil>=7.2.2 ; sys_platform == 'win32'",
    "pydantic>=2,<3",
    "rich>=15.0.0",
    "typer>=0.27.3",
    "uiautomation>=2.0.29 ; sys_platform == 'win32'",
]

[project.scripts]
wemo2 = "wemo2.app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".uv-python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wemo2", "wemo2_collector"]

[tool.uv.build-backend]
module-name = ["wemo2", "wemo2_collector"]

[tool.ruff.lint.flake8-bugbear]
# Typer 的默认参数是框架读取的声明元数据，不是业务函数调用。
extend-immutable-calls = ["typer.Option"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
