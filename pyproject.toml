[project]
name = "wemo2"
version = "0.1.0"
description = "Memos2"
readme = "README.md"
authors = [
    { name = "Jackylee", email = "jieli.work@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "pydantic>=2,<3",
    "typer>=0.27.3",
]

[project.scripts]
wemo2 = "wemo2.app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".uv-python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["wemo2"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
