# 复制为 wemo2.toml 后，应用启动会自动读取。
# 命令行显式选项 > 本文件 > 代码默认配置。
collector = "pseudo"
deduplicator = "pseudo"
store = "pseudo"
database = "data/wemo2.sqlite3"
log_level = "INFO"
log_file = "logs/wemo2.log"
duplicate_stop = "never"  # first：重复立即停；after_n：累计重复 N 次停；never：不停。
duplicate_limit = 3  # 仅 after_n 生效，必须大于等于 1。

# JSON 采集时改为 collector = "json"，并设置输入路径。
# [collector_options]
# path = "examples/observations.json"
# platform = "windows"
# 稳定源 ID 去重与实际持久化可选择 stable / sqlite。
