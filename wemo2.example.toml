# 离线演示两阶段流程；复制为 wemo2.toml 可自动加载。
collector = "pseudo"
store = "pseudo"
resource_dir = "data/moments"
account = "default"
log_file = "logs/wemo2.log"
log_level = "INFO"

# 正常微信采集使用 wemo2.moments.toml；保存时使用同一个配置文件。
# wemo2 collect --config wemo2.example.toml
# wemo2 save --memos --config wemo2.example.toml
# --memos 当前为模拟存储，未连接 Memos；后续目标版本为 0.31。
