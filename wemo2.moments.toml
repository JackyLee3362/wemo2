# 打开发现菜单，再点击朋友圈一行并验证绿色选中样式；已选中则跳过点击。
collector = "windows_screenshot"
# 默认日志输出控制台；需要同时写文件时取消下一行注释。
# log_file = "logs/wemo2.log"

resource_dir = "data/moments"
account = "default" # 本次备份账号，与朋友圈发布者不同。

[collector_options]
platform = "windows"
window_title = "微信"
screenshot_dir = "data/screenshot"
timezone = "Asia/Shanghai"
theme = "dark"

[collector_options.route]
target = "moments_entry"
timeout_seconds = 5

[collector_options.feed]
enabled = true
max_screens = 20
wheel_steps = 3
settle_seconds = 0.6
timeout_seconds = 2
recognize_nickname = true
save_media = true
use_image_arrows = true
media_load_wait_seconds = 5
media_load_timeout_seconds = 30
# 未指定 region 时按 UiProfile 布局和 DPI 裁出右侧朋友圈列表。
# 手动指定时使用客户区物理像素，窗口尺寸或 DPI 改变后需要同步调整。
# [collector_options.feed.region]
# x = 0
# y = 0
# width = 639
# height = 663
