# 匹配左侧指南针图标，点击后用截图验证发现菜单（含朋友圈入口）。
collector = "windows_screenshot"
platform = "windows"
window_title = "微信"
screenshot_dir = "data/screenshot"
log_file = "logs/wemo2.log"

[route]
target = "discover"
match_threshold = 0.9
reference_scale = 1.25
sidebar_ratio = 0.1
menu_ratio = 0.4
timeout_seconds = 5
