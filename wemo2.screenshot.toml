# 截取当前微信窗口，只保存图片，不执行导航、OCR 或朋友圈内容识别。
collector = "windows_screenshot"
# 默认日志输出控制台；需要同时写文件时取消下一行注释。
# log_file = "logs/wemo2.log"
log_level = "INFO"

resource_dir = "data/moments"
account = "default"

[collector_options]
platform = "windows"
window_title = "微信"
screenshot_dir = "data/screenshot"
timezone = "Asia/Shanghai"
theme = "dark"

[collector_options.route]
target = "none"

[collector_options.feed]
enabled = false
